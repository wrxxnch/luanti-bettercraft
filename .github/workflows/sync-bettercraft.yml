name: Sync BetterCraft

on:
  push:
    branches:
      - main

# O GITHUB_TOKEN só precisa ler o repositório de origem.
# O push no repositório bettercraft usa o PAT armazenado em BettercraftToken.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate destination token
        env:
          BETTERCRAFT_TOKEN: ${{ secrets.BettercraftToken }}
        run: |
          if [ -z "$BETTERCRAFT_TOKEN" ]; then
            echo "O segredo BettercraftToken não está configurado."
            exit 1
          fi

      - name: Split BetterCraft
        run: git subtree split --prefix=games/bettercraft -b bettercraft-split

      - name: Push to BetterCraft repository
        env:
          BETTERCRAFT_TOKEN: ${{ secrets.BettercraftToken }}
        run: |
          git push "https://x-access-token:${BETTERCRAFT_TOKEN}@github.com/wrxxnch/bettercraft.git" \
            bettercraft-split:main --force
