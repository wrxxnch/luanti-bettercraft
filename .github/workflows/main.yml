name: Build Bettercraft APK (Every Commit)

on:
  push:
    branches:
      - main  # Ou 'master', dependendo do nome da sua branch principal

jobs:
  repackage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para criar a release
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Gerar ID do Commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl jq

      - name: Baixar APK Base (Luanti)
        run: |
          # Busca o APK mais recente do Luanti (v8a para celulares modernos)
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/luanti-org/luanti/releases/latest \
            | jq -r '.assets[] | select(.name | contains("android-arm64-v8a")) | .browser_download_url' | head -n 1)
          curl -L "$DOWNLOAD_URL" -o base_game.apk

      - name: Injetar Bettercraft no APK
        run: |
          # 1. Extrair o assets.zip do APK original
          7z e base_game.apk assets/assets.zip
          
          # 2. Criar a estrutura: games/bettercraft
          mkdir -p games/bettercraft
          cp -r games/bettercraft/* games/bettercraft/
          
          # 3. Adicionar a pasta no assets.zip
          7z a assets.zip games/bettercraft/
          
          # 4. Atualizar o APK com o novo assets.zip
          7z a base_game.apk assets/assets.zip
          mv base_game.apk Bettercraft-unsigned.apk

      - name: Assinar APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: .
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Preparar Arquivo Final
        run: mv Bettercraft-unsigned-signed.apk Bettercraft-Build-${{ steps.vars.outputs.sha_short }}.apk

      - name: Criar Release Automática
        uses: softprops/action-gh-release@v1
        with:
          files: Bettercraft-Build-${{ steps.vars.outputs.sha_short }}.apk
          tag_name: build-${{ steps.vars.outputs.sha_short }}
          name: "Bettercraft Build: ${{ steps.vars.outputs.sha_short }}"
          body: "Build gerada automaticamente a partir do commit ${{ github.sha }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
